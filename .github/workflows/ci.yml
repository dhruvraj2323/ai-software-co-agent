name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  foundation:
    name: Foundation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14.7

      - name: Sync environment
        run: uv sync --locked

      - name: Verify Python version
        run: uv run python --version

      - name: Verify package import
        run: |
          uv run python -c "import coagent; print('coagent import: PASS')"

      - name: Run security scan
        run: uv run python scripts/ci/security_scan.py
